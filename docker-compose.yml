services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: digitalbanking-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DigitalBank_2026!"
      MSSQL_MEMORY_LIMIT_MB: "1024"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  # The province database nodes (A and B of each province) are in docker/<province>.yml, one Docker
  # project per province, so Docker Desktop groups each province's two nodes together.

  rabbitmq:
    image: rabbitmq:3-management
    container_name: digitalbanking-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  redis:
    image: redis:7
    container_name: digitalbanking-redis
    ports:
      - "6379:6379"

volumes:
  sqlserver-data:
